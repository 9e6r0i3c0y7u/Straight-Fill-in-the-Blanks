<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>直式除法挖空格練習</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#d1d5db;
      --line:#111827;
      --blank-bg:#eef6ff;
      --blank-border:#94a3b8;
      --accent:#2563eb;
      --cell:44px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .wrap{
      max-width:1400px;
      margin:0 auto;
      padding:24px;
    }

    h1{
      margin:0 0 8px;
      font-size:32px;
    }

    .sub{
      color:var(--muted);
      line-height:1.6;
      margin-bottom:18px;
    }

    .panel{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:18px;
      box-shadow:0 8px 24px rgba(0,0,0,.05);
      margin-bottom:18px;
    }

    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:end;
    }

    .field{
      min-width:150px;
    }

    .field label{
      display:block;
      font-size:14px;
      font-weight:700;
      margin-bottom:6px;
    }

    .field input,
    .field select{
      width:100%;
      padding:10px 12px;
      font-size:15px;
      border:1px solid var(--border);
      border-radius:10px;
      background:#fff;
    }

    .btns{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:14px;
    }

    button{
      border:none;
      border-radius:12px;
      padding:10px 16px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }

    .primary{ background:var(--accent); color:#fff; }
    .secondary{ background:#dbeafe; color:#1d4ed8; }
    .ghost{ background:#eef2f7; color:var(--text); }

    .meta{
      margin-top:10px;
      font-size:14px;
      color:var(--muted);
    }

    .sheet{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(520px, 1fr));
      gap:18px;
    }

    .problem{
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      padding:18px;
      box-shadow:0 8px 20px rgba(0,0,0,.04);
      overflow-x:auto;
    }

    .title{
      font-size:18px;
      font-weight:700;
      margin-bottom:12px;
    }

    .division-wrap{
      min-width:420px;
    }

    /* col1 = 除數
       col2 = 除號直線
       col3~5 = 百位、十位、個位 */
    .division-grid{
      display:grid;
      grid-template-columns: 52px 24px repeat(3, var(--cell));
      align-items:center;
      justify-items:center;
      position:relative;
      margin-top:6px;
      margin-bottom:8px;
    }

    .num{
      font-size:24px;
      line-height:1;
      font-family:"Courier New", monospace;
      z-index:2;
    }

    .blank{
      width:34px;
      height:40px;
      border:2px solid var(--blank-border);
      background:var(--blank-bg);
      border-radius:6px;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:2;
    }

    .blank input{
      width:100%;
      height:100%;
      border:none;
      background:transparent;
      text-align:center;
      font-size:24px;
      font-family:"Courier New", monospace;
      outline:none;
      padding:0;
    }

    .line-top{
      align-self:start;
      justify-self:stretch;
      border-top:4px solid var(--line);
      height:0;
      transform:translateY(-2px);
      pointer-events:none;
      z-index:1;
    }

    .line-left{
      align-self:stretch;
      justify-self:start;
      border-left:4px solid var(--line);
      width:0;
      transform:translateX(-2px);
      pointer-events:none;
      z-index:1;
    }

    .minus-line{
      align-self:center;
      justify-self:stretch;
      border-top:3px solid var(--line);
      height:0;
      transform:translateY(10px);
      pointer-events:none;
      z-index:1;
    }

    .hint{
      font-size:13px;
      color:var(--muted);
      margin-top:8px;
      line-height:1.5;
    }

    .eq{
      margin-top:10px;
      font-size:15px;
      color:#374151;
    }

    @media (max-width: 700px){
      .sheet{
        grid-template-columns:1fr;
      }
      .problem{
        padding:14px;
      }
      .division-wrap{
        min-width:400px;
      }
    }

    @media print{
      body{ background:#fff; }
      .no-print{ display:none !important; }
      .wrap{ max-width:none; padding:10mm; }
      .panel{ box-shadow:none; }
      .sheet{ grid-template-columns:repeat(2, 1fr); }
      .problem{ break-inside:avoid; box-shadow:none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="no-print">
      <h1>直式除法挖空格練習</h1>
    </div>

    <div class="panel no-print">
      <div class="controls">
        <div class="field">
          <label for="count">題數</label>
          <input id="count" type="number" min="1" max="20" value="6">
        </div>

        <div class="field">
          <label for="blankCount">每題空格數</label>
          <select id="blankCount">
            <option value="2">2 格</option>
            <option value="3" selected>3 格</option>
            <option value="4">4 格</option>
          </select>
        </div>

        <div class="field">
          <label for="mode">題型</label>
          <select id="mode">
            <option value="1d3d" selected>一位數除三位數</option>
            <option value="1d2d">一位數除二位數</option>
          </select>
        </div>
      </div>

      <div class="btns">
        <button class="primary" id="generateBtn">重新出題</button>
        <button class="secondary" id="toggleBtn">切換顯示答案</button>
        <button class="ghost" id="printBtn">列印 / 存 PDF</button>
      </div>

      <div class="meta" id="summary"></div>
    </div>

    <div class="panel">
      <div id="sheet" class="sheet"></div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    let showAnswers = false;
    let problems = [];

    function randInt(min, max){
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pickRandom(arr, n){
      const copy = [...arr];
      const out = [];
      while(copy.length && out.length < n){
        const i = randInt(0, copy.length - 1);
        out.push(copy.splice(i, 1)[0]);
      }
      return out;
    }

    function generateProblem(mode){
      for(let t = 0; t < 5000; t++){
        const divisor = randInt(2, 9);
        const dividend = mode === "1d2d" ? randInt(10, 99) : randInt(100, 999);
        const quotient = Math.floor(dividend / divisor);
        const remainder = dividend % divisor;

        if(quotient < 10) continue;

        const digits = String(dividend).split('').map(Number);
        let current = 0;
        let started = false;
        const qDigits = [];
        const steps = [];

        for(let i = 0; i < digits.length; i++){
          current = current * 10 + digits[i];

          if(!started && current < divisor){
            qDigits.push(0);
            continue;
          }

          started = true;
          const q = Math.floor(current / divisor);
          const product = q * divisor;
          const rem = current - product;

          qDigits.push(q);
          steps.push({
            current,
            q,
            product,
            remainder: rem,
            endIndex: i,
            currentStr: String(current),
            productStr: String(product),
            remainderStr: String(rem)
          });

          current = rem;
        }

        if(steps.length < 2) continue;

        return {
          divisor,
          dividend,
          quotient,
          remainder,
          digits: String(dividend),
          qStr: String(quotient),
          steps
        };
      }

      throw new Error("題目產生失敗");
    }

    function placeNumber(cells, row, endCol, str, blankable = true){
      const chars = String(str).split("");
      const startCol = endCol - chars.length + 1;
      for(let i = 0; i < chars.length; i++){
        cells.push({
          row,
          col: startCol + i,
          value: chars[i],
          blankable
        });
      }
    }

    function makeCells(problem){
      const cells = [];
      const lines = [];

      const dividendStr = String(problem.dividend);
      const quotientStr = String(problem.quotient);

      const is2DigitDividend = dividendStr.length === 2;
      const dividendStartCol = is2DigitDividend ? 4 : 3;
      const dividendEndCol = dividendStartCol + dividendStr.length - 1;

      const totalRows = 2 + problem.steps.length * 2;

      // 商
      placeNumber(cells, 1, dividendEndCol, quotientStr, true);

      // 除數
      cells.push({
        row: 2,
        col: 1,
        value: String(problem.divisor),
        blankable: false
      });

      // 被除數
      for(let i = 0; i < dividendStr.length; i++){
        cells.push({
          row: 2,
          col: dividendStartCol + i,
          value: dividendStr[i],
          blankable: false
        });
      }

      // 每一步：乘積 + 下一步帶下來的數 / 最後餘數
      let row = 3;

      for(let i = 0; i < problem.steps.length; i++){
        const step = problem.steps[i];
        const endCol = dividendStartCol + step.endIndex;
        const startCol = endCol - String(step.product).length + 1;

        // 乘積
        placeNumber(cells, row, endCol, step.productStr, true);

        // 乘積下面的橫線
        lines.push({
          row,
          startCol,
          endCol
        });

        // 下一行
        if(i < problem.steps.length - 1){
          const nextStep = problem.steps[i + 1];
          const nextEndCol = dividendStartCol + nextStep.endIndex;
          placeNumber(cells, row + 1, nextEndCol, nextStep.currentStr, false);
        } else {
          placeNumber(cells, row + 1, endCol, step.remainderStr, true);
        }

        row += 2;
      }

      return {
        cells,
        lines,
        totalRows
      };
    }

    function renderProblem(problem, index, blankCount){
      const div = document.createElement("div");
      div.className = "problem";

      const { cells, lines, totalRows } = makeCells(problem);

      const blankCandidates = cells.filter(c => c.blankable);
      const chosen = pickRandom(blankCandidates, Math.min(blankCount, blankCandidates.length));
      const blankSet = new Set(chosen.map(c => `${c.row}-${c.col}`));

      let html = `
        <div class="title">第 ${index + 1} 題</div>
        <div class="division-wrap">
          <div class="division-grid" style="grid-template-rows: repeat(${totalRows}, var(--cell));">
      `;

      // 除號
      html += `
        <div class="line-top" style="grid-column:2 / 6; grid-row:2;"></div>
        <div class="line-left" style="grid-column:2; grid-row:2 / ${Math.min(5, totalRows + 1)};"></div>
      `;

      // 每一步減法橫線
      for(const line of lines){
        html += `
          <div class="minus-line"
               style="grid-row:${line.row}; grid-column:${line.startCol} / ${line.endCol + 1};">
          </div>
        `;
      }

      // 數字 / 空格
      for(let row = 1; row <= totalRows; row++){
        for(let col = 1; col <= 5; col++){
          const found = cells.find(c => c.row === row && c.col === col);
          if(!found) continue;

          const key = `${row}-${col}`;
          const style = `grid-row:${row};grid-column:${col};`;

          if(blankSet.has(key)){
            if(showAnswers){
              html += `<div class="blank num" style="${style}">${found.value}</div>`;
            }else{
              html += `<div class="blank" style="${style}"><input maxlength="1" data-answer="${found.value}"></div>`;
            }
          }else{
            html += `<div class="num" style="${style}">${found.value}</div>`;
          }
        }
      }

      html += `
          </div>
        </div>
        <div class="hint">每一步已按百位、十位、個位對齊，並加上減法橫線。</div>
        <div class="eq">${
          showAnswers
            ? `${problem.dividend} ÷ ${problem.divisor} = ${problem.quotient}${problem.remainder ? ` … ${problem.remainder}` : ""}`
            : `${problem.dividend} ÷ ${problem.divisor} = ______`
        }</div>
      `;

      div.innerHTML = html;
      return div;
    }

    function generateAll(){
      const count = Math.max(1, Math.min(20, Number($("count").value) || 6));
      const blankCount = Number($("blankCount").value);
      const mode = $("mode").value;

      problems = [];
      for(let i = 0; i < count; i++){
        problems.push(generateProblem(mode));
      }

      const sheet = $("sheet");
      sheet.innerHTML = "";
      problems.forEach((p, i) => {
        sheet.appendChild(renderProblem(p, i, blankCount));
      });

      $("summary").textContent =
        `已產生 ${count} 題｜${mode === "1d3d" ? "一位數除三位數" : "一位數除二位數"}｜每題 ${blankCount} 格空白`;
    }

    $("generateBtn").addEventListener("click", generateAll);
    $("toggleBtn").addEventListener("click", () => {
      showAnswers = !showAnswers;
      generateAll();
    });
    $("printBtn").addEventListener("click", () => window.print());

    generateAll();
  </script>
</body>
</html>
