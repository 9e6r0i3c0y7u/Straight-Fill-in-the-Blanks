<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>直式除法挖空格練習</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#d1d5db;
      --line:#111827;
      --blank-bg:#eef6ff;
      --blank-border:#94a3b8;
      --accent:#2563eb;
      --cell:44px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .wrap{
      max-width:1400px;
      margin:0 auto;
      padding:24px;
    }

    h1{
      margin:0 0 8px;
      font-size:32px;
    }

    .sub{
      color:var(--muted);
      line-height:1.6;
      margin-bottom:18px;
    }

    .panel{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:18px;
      box-shadow:0 8px 24px rgba(0,0,0,.05);
      margin-bottom:18px;
    }

    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:end;
    }

    .field{
      min-width:150px;
    }

    .field label{
      display:block;
      font-size:14px;
      font-weight:700;
      margin-bottom:6px;
    }

    .field input,
    .field select{
      width:100%;
      padding:10px 12px;
      font-size:15px;
      border:1px solid var(--border);
      border-radius:10px;
      background:#fff;
    }

    .btns{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:14px;
    }

    button{
      border:none;
      border-radius:12px;
      padding:10px 16px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }

    .primary{ background:var(--accent); color:#fff; }
    .secondary{ background:#dbeafe; color:#1d4ed8; }
    .ghost{ background:#eef2f7; color:var(--text); }

    .meta{
      margin-top:10px;
      font-size:14px;
      color:var(--muted);
    }

    /* 關鍵修正：不要讓卡片窄到壓壞直式 */
    .sheet{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(520px, 1fr));
      gap:18px;
    }

    .problem{
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      padding:18px;
      box-shadow:0 8px 20px rgba(0,0,0,.04);
      overflow-x:auto;
    }

    .title{
      font-size:18px;
      font-weight:700;
      margin-bottom:12px;
    }

    /* 真正固定格線 */
    .division-wrap{
      min-width:480px;
    }

    .division-grid{
      display:grid;
      grid-template-columns: 52px repeat(5, var(--cell));
      grid-template-rows: repeat(7, var(--cell));
      align-items:center;
      justify-items:center;
      position:relative;
      margin-top:6px;
      margin-bottom:8px;
    }

    .num{
      font-size:24px;
      line-height:1;
      font-family:"Courier New", monospace;
    }

    .blank{
      width:34px;
      height:40px;
      border:2px solid var(--blank-border);
      background:var(--blank-bg);
      border-radius:6px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .blank input{
      width:100%;
      height:100%;
      border:none;
      background:transparent;
      text-align:center;
      font-size:24px;
      font-family:"Courier New", monospace;
      outline:none;
      padding:0;
    }

    .line-top{
      grid-column:2 / 7;
      grid-row:2;
      align-self:start;
      justify-self:stretch;
      border-top:4px solid var(--line);
      height:0;
      transform:translateY(-2px);
      pointer-events:none;
    }

    .line-left{
      grid-column:2;
      grid-row:2 / 4;
      align-self:stretch;
      justify-self:start;
      border-left:4px solid var(--line);
      width:0;
      transform:translateX(-2px);
      pointer-events:none;
    }

    .hint{
      font-size:13px;
      color:var(--muted);
      margin-top:8px;
      line-height:1.5;
    }

    .eq{
      margin-top:10px;
      font-size:15px;
      color:#374151;
    }

    @media (max-width: 700px){
      .sheet{
        grid-template-columns:1fr;
      }
      .problem{
        padding:14px;
      }
      .division-wrap{
        min-width:460px;
      }
    }

    @media print{
      body{ background:#fff; }
      .no-print{ display:none !important; }
      .wrap{ max-width:none; padding:10mm; }
      .panel{ box-shadow:none; }
      .sheet{ grid-template-columns:repeat(2, 1fr); }
      .problem{ break-inside:avoid; box-shadow:none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="no-print">
      <h1>直式除法挖空格練習</h1>
      <div class="sub">像作業簿一樣，直式大部分已寫好，只留下幾格讓學生填。</div>
    </div>

    <div class="panel no-print">
      <div class="controls">
        <div class="field">
          <label for="count">題數</label>
          <input id="count" type="number" min="1" max="20" value="6">
        </div>

        <div class="field">
          <label for="blankCount">每題空格數</label>
          <select id="blankCount">
            <option value="2">2 格</option>
            <option value="3" selected>3 格</option>
            <option value="4">4 格</option>
          </select>
        </div>

        <div class="field">
          <label for="mode">題型</label>
          <select id="mode">
            <option value="1d3d" selected>一位數除三位數</option>
            <option value="1d2d">一位數除二位數</option>
          </select>
        </div>
      </div>

      <div class="btns">
        <button class="primary" id="generateBtn">重新出題</button>
        <button class="secondary" id="toggleBtn">切換顯示答案</button>
        <button class="ghost" id="printBtn">列印 / 存 PDF</button>
      </div>

      <div class="meta" id="summary"></div>
    </div>

    <div class="panel">
      <div id="sheet" class="sheet"></div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    let showAnswers = false;
    let problems = [];

    function randInt(min, max){
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pickRandom(arr, n){
      const copy = [...arr];
      const out = [];
      while(copy.length && out.length < n){
        const i = randInt(0, copy.length - 1);
        out.push(copy.splice(i, 1)[0]);
      }
      return out;
    }

    function generateProblem(mode){
      for(let t = 0; t < 5000; t++){
        const divisor = randInt(2, 9);
        const dividend = mode === "1d2d" ? randInt(10, 99) : randInt(100, 999);
        const quotient = Math.floor(dividend / divisor);
        const remainder = dividend % divisor;
        if(quotient < 10) continue;

        const digits = String(dividend).split('').map(Number);

        let current = 0;
        const qDigits = [];
        const steps = [];

        for(let i = 0; i < digits.length; i++){
          current = current * 10 + digits[i];
          const q = Math.floor(current / divisor);
          qDigits.push(q);
          const product = q * divisor;
          const rem = current - product;

          if(q !== 0 || steps.length > 0){
            steps.push({
              current,
              q,
              product,
              remainder: rem,
              endIndex: i
            });
          }
          current = rem;
        }

        const qStr = String(quotient);

        if(steps.length < 2) continue;

        const s1 = steps[0];
        const s2 = steps[1];

        return {
          divisor,
          dividend,
          quotient,
          remainder,
          qStr,
          step1: s1,
          step2: s2
        };
      }
      throw new Error("題目產生失敗");
    }

    function makeCells(problem){
      const dividendStr = String(problem.dividend).padStart(3, " ");
      const quotientStr = String(problem.quotient).padStart(3, " ");

      const s1Product = String(problem.step1.product).padStart(3, " ");
      const s1Remain  = String(problem.step1.remainder).padStart(3, " ");
      const s2Current = String(problem.step2.current).padStart(3, " ");
      const s2Product = String(problem.step2.product).padStart(3, " ");
      const finalRem  = String(problem.remainder).padStart(3, " ");

      const cells = [];

      // 第1列：商，放在第4~6欄
      for(let i = 0; i < 3; i++){
        cells.push({
          row: 1, col: 4 + i,
          value: quotientStr[i],
          blankable: true
        });
      }

      // 第2列：除數在第1欄；被除數在第4~6欄
      cells.push({ row: 2, col: 1, value: String(problem.divisor), blankable: false });
      for(let i = 0; i < 3; i++){
        cells.push({
          row: 2, col: 4 + i,
          value: dividendStr[i],
          blankable: false
        });
      }

      // 第3列：第一次乘積
      for(let i = 0; i < 3; i++){
        if(s1Product[i] !== " "){
          cells.push({
            row: 3, col: 4 + i,
            value: s1Product[i],
            blankable: true
          });
        }
      }

      // 第4列：第一次相減後
      for(let i = 0; i < 3; i++){
        if(s1Remain[i] !== " "){
          cells.push({
            row: 4, col: 4 + i,
            value: s1Remain[i],
            blankable: true
          });
        }
      }

      // 第5列：往下移後的新數
      for(let i = 0; i < 3; i++){
        if(s2Current[i] !== " "){
          cells.push({
            row: 5, col: 4 + i,
            value: s2Current[i],
            blankable: false
          });
        }
      }

      // 第6列：第二次乘積
      for(let i = 0; i < 3; i++){
        if(s2Product[i] !== " "){
          cells.push({
            row: 6, col: 4 + i,
            value: s2Product[i],
            blankable: true
          });
        }
      }

      // 第7列：最後餘數
      for(let i = 0; i < 3; i++){
        if(finalRem[i] !== " "){
          cells.push({
            row: 7, col: 4 + i,
            value: finalRem[i],
            blankable: true
          });
        }
      }

      return cells;
    }

    function renderProblem(problem, index, blankCount){
      const div = document.createElement("div");
      div.className = "problem";

      const cells = makeCells(problem);
      const blankCandidates = cells.filter(c => c.blankable);
      const chosen = pickRandom(blankCandidates, Math.min(blankCount, blankCandidates.length));

      const blankSet = new Set(chosen.map(c => `${c.row}-${c.col}`));

      let html = `
        <div class="title">第 ${index + 1} 題</div>
        <div class="division-wrap">
          <div class="division-grid">
            <div class="line-top"></div>
            <div class="line-left"></div>
      `;

      for(let row = 1; row <= 7; row++){
        for(let col = 1; col <= 6; col++){
          const found = cells.find(c => c.row === row && c.col === col);
          if(!found) continue;

          const key = `${row}-${col}`;
          const style = `grid-row:${row};grid-column:${col};`;

          if(blankSet.has(key)){
            if(showAnswers){
              html += `<div class="blank num" style="${style}">${found.value}</div>`;
            }else{
              html += `<div class="blank" style="${style}"><input maxlength="1" data-answer="${found.value}"></div>`;
            }
          }else{
            html += `<div class="num" style="${style}">${found.value}</div>`;
          }
        }
      }

      html += `
          </div>
        </div>
        <div class="hint">題目只挖掉幾個關鍵數字，讓解題者補上。</div>
        <div class="eq">${showAnswers
          ? `${problem.dividend} ÷ ${problem.divisor} = ${problem.quotient}${problem.remainder ? ` … ${problem.remainder}` : ""}`
          : `${problem.dividend} ÷ ${problem.divisor} = ______`}</div>
      `;

      div.innerHTML = html;
      return div;
    }

    function generateAll(){
      const count = Math.max(1, Math.min(20, Number($("count").value) || 6));
      const blankCount = Number($("blankCount").value);
      const mode = $("mode").value;

      problems = [];
      for(let i = 0; i < count; i++){
        problems.push(generateProblem(mode));
      }

      const sheet = $("sheet");
      sheet.innerHTML = "";
      problems.forEach((p, i) => {
        sheet.appendChild(renderProblem(p, i, blankCount));
      });

      $("summary").textContent =
        `已產生 ${count} 題｜${mode === "1d3d" ? "一位數除三位數" : "一位數除二位數"}｜每題 ${blankCount} 格空白`;
    }

    $("generateBtn").addEventListener("click", generateAll);
    $("toggleBtn").addEventListener("click", () => {
      showAnswers = !showAnswers;
      generateAll();
    });
    $("printBtn").addEventListener("click", () => window.print());

    generateAll();
  </script>
</body>
</html>
